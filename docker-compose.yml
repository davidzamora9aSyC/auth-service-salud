services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meusalud_auth
      POSTGRES_USER: meusalud_auth
      POSTGRES_PASSWORD: meusalud_auth
    ports:
      - "5435:5432"
    volumes:
      - meusalud-auth-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  auth-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-auth-service-salud:${IMAGE_TAG:-latest}
    build: .
    env_file:
      - .env
      - .env.local
    environment:
      TWO_FACTOR_WHATSAPP_TEMPLATE_KEY: MFA_LOGIN
    ports:
      - "3000:3000"
    volumes:
      - ./secrets:/keys:ro
    depends_on:
      - db
      - communication-service

  clinics-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-clinics-service:${IMAGE_TAG:-latest}
    build:
      context: ../clinics-service
    env_file:
      - ../clinics-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=auth
      PORT: 3025
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_AUTH: auth.events
      RABBITMQ_EXCHANGE_CLINICS: clinics.events
      RABBITMQ_QUEUE_CLINICS_AUTH: clinics.q.auth
    ports:
      - "3025:3025"
    depends_on:
      - db

  communication-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-communication-service:${IMAGE_TAG:-latest}
    build:
      context: ../communication-service
    env_file:
      - ../communication-service/.env.compose
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=notification
      RABBITMQ_QUEUE_AUTH: comms.q.auth
      RABBITMQ_QUEUE_QUESTIONS: comms.q.questions
      RABBITMQ_EXCHANGE_AUTH: auth.events
      RABBITMQ_EXCHANGE_QUESTIONS: questions.events
      RABBITMQ_EXCHANGE_COMMUNICATION: communication.events
      WELCOME_TEMPLATE_PATIENT: bienvenida_pacientes
      WELCOME_TEMPLATE_DOCTOR: bienvenida_doctor
      WELCOME_TEMPLATE_CLINIC: bienvenida_clinica
      META_TEMPLATE_LANGUAGE_CODE: es_CO
      META_TEMPLATE_MFA_LOGIN: restablecer_contrasena
    ports:
      - "3006:3006"
    depends_on:
      - db

  ai-assistant-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-ai-assistant-service:${IMAGE_TAG:-latest}
    build:
      context: ../ai-assistant-service
    env_file:
      - ../ai-assistant-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=ai
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_COMMUNICATION: communication.events
      RABBITMQ_QUEUE_WHATSAPP_INBOUND: ai.q.whatsapp.inbound
      RABBITMQ_ROUTINGKEY_WHATSAPP_INBOUND: whatsapp.inbound
      RABBITMQ_EXCHANGE_AI: ai.events
      GATEWAY_BASE_URL: http://meusaludgateway:3020
      AUTH_INTERNAL_BASE_URL: http://auth-service:3000/authms
      AI_MODEL: gpt-5.1
      AI_DEBUG_LOGS: "true"
      AI_USAGE_PRICE_INPUT: 0
      AI_USAGE_PRICE_OUTPUT: 0
      AI_INBOUND_DEBOUNCE_MS: 15000
      META_WHATSAPP_TOKEN: ""
      META_WHATSAPP_API_BASE_URL: https://graph.facebook.com
      META_WHATSAPP_API_VERSION: v22.0
      META_WHATSAPP_WABA_ID: ""
    ports:
      - "3030:3030"
    depends_on:
      - db
      - communication-service

  users-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-users-service:${IMAGE_TAG:-latest}
    build:
      context: ../users-service
    env_file:
      - ../users-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=users
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_IMAGES: images.events
      RABBITMQ_QUEUE_IMAGES: users.q.images
    ports:
      - "3008:3008"
    depends_on:
      - db

  doctors-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-doctors-service:${IMAGE_TAG:-latest}
    build:
      context: ../doctors-service
    env_file:
      - ../doctors-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=doctors
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_IMAGES: images.events
      RABBITMQ_QUEUE_IMAGES: doctors.q.images
      RABBITMQ_EXCHANGE_REVIEWS: reviews.events
      RABBITMQ_QUEUE_REVIEWS: doctors.q.reviews
    ports:
      - "3009:3009"
    depends_on:
      - db

  reminders-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-reminders-service:${IMAGE_TAG:-latest}
    build:
      context: ../reminders-service
    env_file:
      - ../reminders-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=reminders
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_REMINDERS: reminders.events
      RABBITMQ_QUEUE_REMINDERS_STATUS: reminders.q.status
      DOCTORS_INTERNAL_BASE_URL: http://doctors-service:3009/doctorsms
      USERS_INTERNAL_BASE_URL: http://users-service:3008/usersms
    ports:
      - "3021:3021"
    depends_on:
      - db
      - doctors-service

  appointments-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-appointments-service:${IMAGE_TAG:-latest}
    build:
      context: ../appointments-service
    env_file:
      - ../appointments-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=appointments
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      SERVICES_SERVICE_URL: http://services-service:3011/servicesms
      AVAILABILITY_SERVICE_URL: http://availability-service:3012/availabilityms
      CLINICS_INTERNAL_BASE_URL: http://clinics-service:3025/clinicsms
      USERS_INTERNAL_BASE_URL: http://users-service:3008/usersms
      IMAGES_INTERNAL_BASE_URL: http://images-service:3019/imagesms
      REMINDERS_INTERNAL_BASE_URL: http://reminders-service:3021/remindersms
    ports:
      - "3010:3010"
    depends_on:
      - db

  reviews-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-reviews-service:${IMAGE_TAG:-latest}
    build:
      context: ../reviews-service
    env_file:
      - ../reviews-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=reviews
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_REVIEWS: reviews.events
      APPOINTMENTS_INTERNAL_BASE_URL: http://appointments-service:3010/appointmentsms
      USERS_INTERNAL_BASE_URL: http://users-service:3008/usersms
    ports:
      - "3023:3023"
    depends_on:
      - db
      - appointments-service

  messages-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-messages-service:${IMAGE_TAG:-latest}
    build:
      context: ../messages-service
    env_file:
      - ../messages-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=messages
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_MESSAGES: messages.events
      APPOINTMENTS_INTERNAL_BASE_URL: http://appointments-service:3010/appointmentsms
      USERS_INTERNAL_BASE_URL: http://users-service:3008/usersms
      DOCTORS_INTERNAL_BASE_URL: http://doctors-service:3009/doctorsms
      IMAGES_INTERNAL_BASE_URL: http://images-service:3019/imagesms
    ports:
      - "3024:3024"
    depends_on:
      - db
      - appointments-service
      - redis

  support-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-support-service:${IMAGE_TAG:-latest}
    build:
      context: ../support-service
    env_file:
      - ../support-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=support
    ports:
      - "3027:3027"
    depends_on:
      - db

  meured-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-meured-service:${IMAGE_TAG:-latest}
    build:
      context: ../meured-service
    env_file:
      - ../meured-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=meured
      PORT: 3032
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_MEURED: meured.events
      RABBITMQ_QUEUE_STATS: meured.q.stats
      INTERNAL_API_KEY: local-internal-meured
    ports:
      - "3032:3032"
    depends_on:
      - db

  meured-graph-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-meured-graph-service:${IMAGE_TAG:-latest}
    build:
      context: ../meured-graph-service
    env_file:
      - ../meured-graph-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=meured_graph
      PORT: 3033
      INTERNAL_API_KEY: local-internal-meured
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_MEURED: meured.events
    ports:
      - "3033:3033"
    depends_on:
      - db

  meured-content-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-meured-content-service:${IMAGE_TAG:-latest}
    build:
      context: ../meured-content-service
    env_file:
      - ../meured-content-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=meured_content
      PORT: 3034
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_MEURED: meured.events
    ports:
      - "3034:3034"
    depends_on:
      - db

  meured-jobs-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-meured-jobs-service:${IMAGE_TAG:-latest}
    build:
      context: ../meured-jobs-service
    env_file:
      - ../meured-jobs-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=meured_jobs
      PORT: 3035
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_MEURED: meured.events
    ports:
      - "3035:3035"
    depends_on:
      - db

  meured-events-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-meured-events-service:${IMAGE_TAG:-latest}
    build:
      context: ../meured-events-service
    env_file:
      - ../meured-events-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=meured_events
      PORT: 3036
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_MEURED: meured.events
    ports:
      - "3036:3036"
    depends_on:
      - db

  meured-feed-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-meured-feed-service:${IMAGE_TAG:-latest}
    build:
      context: ../meured-feed-service
    env_file:
      - ../meured-feed-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=meured_feed
      PORT: 3037
      REDIS_URL: redis://redis:6379
      GRAPH_BASE_URL: http://meured-graph-service:3033
      INTERNAL_GRAPH_API_KEY: local-internal-meured
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_MEURED: meured.events
      RABBITMQ_QUEUE_FEED: meured.q.feed
    ports:
      - "3037:3037"
    depends_on:
      - db
      - redis

  questions-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-questions-service:${IMAGE_TAG:-latest}
    build:
      context: ../questions-service
    env_file:
      - ../questions-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=questions
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_QUESTIONS: questions.events
      DOCTORS_INTERNAL_BASE_URL: http://doctors-service:3009/doctorsms
    ports:
      - "3026:3026"
    depends_on:
      - db

  services-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-services-service:${IMAGE_TAG:-latest}
    build:
      context: ../services-service
    env_file:
      - ../services-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=services
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
    ports:
      - "3011:3011"
    depends_on:
      - db

  availability-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-availability-service:${IMAGE_TAG:-latest}
    build:
      context: ../availability-service
    env_file:
      - ../availability-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=availability
      SERVICES_BASE_URL: http://services-service:3011/servicesms
      APPOINTMENTS_BASE_URL: http://appointments-service:3010/appointmentsms
    ports:
      - "3012:3012"
    depends_on:
      - db

  templates-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-templates-service:${IMAGE_TAG:-latest}
    build:
      context: ../templates-service
    env_file:
      - ../templates-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=templates
    ports:
      - "3022:3022"
    depends_on:
      - db

  interoperability-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-interoperability-service:${IMAGE_TAG:-latest}
    build:
      context: ../interoperability-service
    env_file:
      - ../interoperability-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=interoperability
      USERS_INTERNAL_BASE_URL: http://users-service:3008/usersms
      DOCTORS_INTERNAL_BASE_URL: http://doctors-service:3009/doctorsms
      APPOINTMENTS_INTERNAL_BASE_URL: http://appointments-service:3010/appointmentsms
    ports:
      - "3031:3031"
    depends_on:
      - db
      - users-service
      - doctors-service
      - appointments-service

  meili:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  meusaludgateway:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-meusaludgateway:${IMAGE_TAG:-latest}
    build:
      context: ../meusaludgateway
    env_file:
      - ../meusaludgateway/.env
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:3007,https://front-meu-salud.vercel.app,http://192.168.1.7:3007,https://hamulate-lakenya-contributively.ngrok-free.dev
      CLINICS_BASE_URL: http://clinics-service:3025
      AI_BASE_URL: http://ai-assistant-service:3030
      GATEWAY_AI_DEBUG: "true"
      QUESTIONS_BASE_URL: http://questions-service:3026
      SUPPORT_BASE_URL: http://support-service:3027
      MEURED_BASE_URL: http://meured-service:3032
      MEURED_GRAPH_BASE_URL: http://meured-graph-service:3033
      MEURED_CONTENT_BASE_URL: http://meured-content-service:3034
      MEURED_JOBS_BASE_URL: http://meured-jobs-service:3035
      MEURED_EVENTS_BASE_URL: http://meured-events-service:3036
      MEURED_FEED_BASE_URL: http://meured-feed-service:3037
    ports:
      - "3020:3020"
    depends_on:
      - auth-service
      - ai-assistant-service
      - clinics-service
      - users-service
      - doctors-service
      - appointments-service
      - reviews-service
      - messages-service
      - support-service
      - meured-service
      - meured-graph-service
      - meured-content-service
      - meured-jobs-service
      - meured-events-service
      - meured-feed-service
      - questions-service
      - services-service
      - availability-service
      - templates-service
      - interoperability-service
      - communication-service
      - reminders-service
      - consents-service
      - analytics-service
      - images-service
      - redis

  search-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-search-service:${IMAGE_TAG:-latest}
    build:
      context: ../search-service
    env_file:
      - ../search-service/.env
    ports:
      - "3017:3017"
    depends_on:
      - meili
      - meusaludgateway

  subscriptions-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-subscriptions-service:${IMAGE_TAG:-latest}
    build:
      context: ../subscriptions-service
    env_file:
      - ../subscriptions-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=subscriptions
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_PAYMENTS: payments.events
      RABBITMQ_EXCHANGE_SUBSCRIPTIONS: subscriptions.events
      RABBITMQ_QUEUE_PAYMENTS: subs.q.payments
      SUBSCRIPTIONS_INTERNAL_API_KEY: ""
    ports:
      - "3013:3013"
    depends_on:
      - db

  payments-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-payments-service:${IMAGE_TAG:-latest}
    build:
      context: ../payments-service
    env_file:
      - ../payments-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=payments
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_PAYMENTS: payments.events
      SUBSCRIPTIONS_BASE_URL: http://subscriptions-service:3013/subscriptionsms
      WOMPI_ENV: sandbox
    ports:
      - "3014:3014"
    depends_on:
      - db

  analytics-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-analytics-service:${IMAGE_TAG:-latest}
    build:
      context: ../analytics-service
    env_file:
      - ../analytics-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=analytics
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_APPOINTMENTS: appointments.events
      RABBITMQ_EXCHANGE_SERVICES: services.events
      RABBITMQ_EXCHANGE_DOCTORS: doctors.events
      RABBITMQ_EXCHANGE_REVIEWS: reviews.events
      RABBITMQ_QUEUE_ANALYTICS: analytics.q.events
      CLINICS_INTERNAL_BASE_URL: http://clinics-service:3025/clinicsms
    ports:
      - "3015:3015"
    depends_on:
      - db

  images-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-images-service:${IMAGE_TAG:-latest}
    build:
      context: ../images-service
    env_file:
      - ../images-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=images
      S3_BUCKET_PRIVATE: images-private
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_FORCE_PATH_STYLE: "true"
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_IMAGES: images.events
    ports:
      - "3019:3019"
    depends_on:
      - db
      - minio

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - minio_data:/data

  consents-service:
    image: ${DOCKERHUB_USERNAME:-local}/meusalud-consents-service:${IMAGE_TAG:-latest}
    build:
      context: ../consents-service
    env_file:
      - ../consents-service/.env
    environment:
      DATABASE_URL: postgresql://meusalud_auth:meusalud_auth@db:5432/meusalud_auth?schema=consents
      RABBITMQ_URL: amqp://app:app_pass_123@host.docker.internal:5673/
      RABBITMQ_EXCHANGE_CONSENTS: consents.events
    ports:
      - "3018:3018"
    depends_on:
      - db

volumes:
  meusalud-auth-db:
  meili_data:
  minio_data:
  redis_data:

